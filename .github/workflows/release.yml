name: Build & Release Standalone Windows Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application Directory via PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean GilgaripsPrintOps.spec

      - name: Verify PyInstaller Directory Built
        run: |
          if (Test-Path "dist\GilgaripsPrintOps\GilgaripsPrintOps.exe") {
            Write-Host "GilgaripsPrintOps.exe successfully created in dist\GilgaripsPrintOps!"
            Get-Item "dist\GilgaripsPrintOps\GilgaripsPrintOps.exe" | Select-Object Name, Length
          } else {
            Write-Error "dist\GilgaripsPrintOps\GilgaripsPrintOps.exe was not found"
            exit 1
          }

      - name: Compile Inno Setup Windows Installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss
        shell: pwsh

      - name: Verify Installer Built
        run: |
          if (Test-Path "dist-installer\GilgaripsPrintOps-Setup.exe") {
            Write-Host "GilgaripsPrintOps-Setup.exe successfully created!"
            Get-Item "dist-installer\GilgaripsPrintOps-Setup.exe" | Select-Object Name, Length
          } else {
            Write-Error "dist-installer\GilgaripsPrintOps-Setup.exe was not found"
            exit 1
          }

      - name: Create GitHub Release and Upload Binary Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/GilgaripsPrintOps-Setup.exe
          tag_name: ${{ github.ref_name }}
          name: Gilgarips PrintOps ${{ github.ref_name }}
          body: |
            ### Gilgarips PrintOps Desktop Application Installer
            
            **Installation:**
            Download and run **`GilgaripsPrintOps-Setup.exe`** below. It installs into your personal Windows user directory (`AppData\Local\Programs\Gilgarips PrintOps`) with start menu shortcuts, no admin elevation required, and supports seamless in-app auto-updates.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
